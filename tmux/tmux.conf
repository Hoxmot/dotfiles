# borrowed from tmux-sensible
# is_osx() {
# 	local platform=$(uname)
# 	[ "$platform" == "Darwin" ]
# }

# a magic line to fix tmux colours
# should be set to the same value as $TERM without tmux
set-option -sa terminal-features ',xterm-ghostty:RGB'

# Index windows & panes from 1 (not 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# copy & paste like in vim
bind P paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# ACTION REQUIRED
# copy selection into clipboard
# For Linux
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# For MacOS
# if is_osx; then
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
# fi

# enable mouse mode (>=tmux 2.1)
set -g mouse on

# enable mouse mode (<tmux 2.1)
# clickable windows
# set -g mouse-select-window on
# clickable panes
# set -g mouse-select-pane on
# resizable panes
# set -g mouse-resize-pane on

# don't rename windows automatically
set-option -g allow-rename off

# set active window colour
# ayu-dark elevated bg; the dracula plugin draws over this, but keeping it
# in the same palette avoids a stray purple fringe on the active window
set-window-option -g window-status-current-style bg=#273747

# set max history for a single panes
set-option -g history-limit 10000

# set copy-mode-vi as a copy mode
set-option -g mode-keys vi
# default: emacs

#############################################################
# A set of options copied from tmux-sensible                #
# https://github.com/tmux-plugins/tmux-sensible/tree/master #
#############################################################

# Reduced the delay of the ESC button. It should be bigger than 0
# Default: 500
# @see: https://superuser.com/a/1809494
set -s escape-time 100

# Increase the time a message is displayed to 5s
set-option -g display-time 5000

# upgrade $TERM inside tmux, tmux 2.0+
# tmux-256color (vs the older screen-256color) advertises italics, undercurl
# and extended underline colours, which nvim and friends look for
set-option -s default-terminal "tmux-256color"

# I also have no idea here
# focus events enabled for terminals that support them
set-option -g focus-events on

# I they say so
# super useful when using "grouped sessions" and multi-monitor setup
# Warning: according to the original config, they don't change it for iTerm
set-window-option -g aggressive-resize on

###############
# End of copy #
###############

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Dracula plugin config
# Recoloured to ayu-dark to match the Ghostty theme.
# The palette below overrides the plugin's built-in variables (see
# dracula/tmux docs/color_theming). Variable *names* stay dracula's;
# only the hex values are ayu.
set -g @dracula-colors "
white='#bfbdb6'
gray='#131721'
dark_gray='#0b0e14'
light_purple='#d2a6ff'
dark_purple='#273747'
cyan='#95e6cb'
green='#aad94c'
orange='#ff8f40'
red='#f07178'
purple='#d2a6ff'
pink='#f29668'
yellow='#e6b450'
"

set -g @dracula-plugins "battery cpu-usage ram-usage time"
set -g @dracula-refresh-rate 1
set -g @dracula-show-fahrenheit false
set -g @dracula-day-month true
set -g @dracula-military-time true

# Initialize Tmux Plugin Manager (keep this line at the very bottom of tmux.conf)
run ~/.tmux/plugins/tpm/tpm
